<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4d29">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>زمین‌یار هوشمند</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">🌾 زمین‌یار هوشمند</div>
  <nav id="tabs">
    <button data-tab="map" class="on">نقشه و ثبت زمین</button>
    <button data-tab="parcels">زمین‌ها <span id="cnt-parcels" class="badge">۰</span></button>
    <button data-tab="settings">تنظیمات ارزش‌گذاری</button>
    <button data-tab="people">اشخاص و تقسیم</button>
    <button data-tab="project">پروژه</button>
  </nav>
</header>

<main>
  <section id="tab-map" class="tab on">
    <aside id="side">
      <div id="form-root"></div>
    </aside>
    <div id="mapwrap">
      <div id="maptools">
        <form id="search-form" autocomplete="off">
          <input id="search-q" type="search" placeholder="جست‌وجوی روستا، شهر، منطقه یا مختصات (مثلاً ۳۲٫۶۵، ۵۱٫۶۷)">
          <button type="submit">جست‌وجو</button>
        </form>
        <div id="search-results"></div>
      </div>
      <div id="map-banner" hidden></div>
      <div id="map"></div>
      <div id="map-cross" hidden></div>
      <div id="loupe" hidden><div id="loupe-map"></div><div class="loupe-cross"></div></div>
      <div id="draw-bar" hidden></div>
      <div id="detect-bar" hidden></div>
      <div id="import-panel" hidden></div>
      <div id="split-panel" hidden></div>
      <div id="gps-panel" class="sheet" hidden></div>
    </div>
  </section>
  <section id="tab-parcels" class="tab"><div class="page" id="parcels-root"></div></section>
  <section id="tab-settings" class="tab"><div class="page" id="settings-root"></div></section>
  <section id="tab-people" class="tab"><div class="page" id="people-root"></div></section>
  <section id="tab-project" class="tab"><div class="page" id="project-root"></div></section>
</main>

<div id="print-root"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="vendor/leaflet.js"></script>
<script src="vendor/proj4.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="core.js"></script>
<script src="js/seed.js"></script>
<script src="detect.js"></script>
<script src="js/app.js"></script>
<script src="js/map.js"></script>
<script src="js/autodetect.js"></script>
<script src="js/split.js"></script>
<script src="js/importer.js"></script>
<script src="js/gps.js"></script>
<script src="js/form.js"></script>
<script src="js/parcels.js"></script>
<script src="js/settings.js"></script>
<script src="js/cases.js"></script>
<script src="js/people.js"></script>
<script src="js/project.js"></script>
<script>App.start();
if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(function(){});</script>
</body>
</html>
