name: Build Android APK

# ساخت APK با Capacitor. Android SDK روی تصویر ubuntu-latest از پیش نصب است،
# پس فقط پلتفرم/ابزار ساخت موردنیاز (API 36) آماده می‌شود.
on:
  workflow_dispatch: {}
  push:
    branches: ['**']
  pull_request: {}

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # برای انتشار APK در «آخرین نسخه‌ی اندروید» (Releases)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }   # @capacitor/cli 8 به Node 22 یا جدیدتر نیاز دارد
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Prepare Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          which sdkmanager || ls "$ANDROID_HOME/cmdline-tools" || true
          (yes | sdkmanager --licenses) > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
      - name: Install dependencies
        run: npm ci
      - name: Run calculation and DOM tests before packaging
        run: npm run test:all
      - name: Copy web app into the Android project
        run: npm run android:sync
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Create checksum
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: zamin-yar-apk-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256

      # لینک همیشگی دانلود اندروید (بدون نیاز به ورود به GitHub):
      # https://github.com/hirad2969/Zamin_yar/releases/latest/download/zamin-yar.apk
      - name: انتشار APK در «آخرین نسخه‌ی اندروید»
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-latest
        run: |
          set -e
          cp android/app/build/outputs/apk/debug/app-debug.apk zamin-yar.apk
          SIZE=$(du -h zamin-yar.apk | cut -f1)
          NOTES=$(printf '%s\n' \
            'نسخه‌ی اندروید زمین‌یار هوشمند (APK آزمایشی، امضای debug).' \
            '' \
            "ساخته‌شده از: \`$GITHUB_SHA\` — شاخه‌ی \`${GITHUB_REF_NAME}\` — اجرای #${GITHUB_RUN_NUMBER} — حجم ${SIZE}" \
            '' \
            'نصب: فایل `zamin-yar.apk` را روی گوشی دانلود کنید و اجازه‌ی «نصب از منبع ناشناس» را بدهید.' \
            'این فایل با هر به‌روزرسانی شاخه‌ی main دوباره ساخته می‌شود و همین نشانی همیشه آخرین نسخه را می‌دهد:' \
            'https://github.com/hirad2969/Zamin_yar/releases/latest/download/zamin-yar.apk' \
            '' \
            'نسخه‌ی وب (بدون نصب): https://hirad2969.github.io/Zamin_yar/')
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" zamin-yar.apk --clobber
            gh release edit "$TAG" --title 'زمین‌یار هوشمند — آخرین نسخه‌ی اندروید' --notes "$NOTES" --latest
          else
            gh release create "$TAG" zamin-yar.apk --target "$GITHUB_SHA" \
              --title 'زمین‌یار هوشمند — آخرین نسخه‌ی اندروید' --notes "$NOTES" --latest
          fi
