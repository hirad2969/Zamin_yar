format_version: '13'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: android
workflows:
  primary:
    description: ساخت APK زمین‌یار (Capacitor)
    steps:
    - activate-ssh-key@4: {}
    - git-clone@8: {}
    - script@1:
        title: Build web assets and sync Capacitor
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            node -v; npm -v; java -version
            npm ci
            npm run android:sync
    - android-build@1:
        inputs:
        - project_location: $BITRISE_SOURCE_DIR/android
        - module: app
        - variant: debug
        - build_type: apk
    - deploy-to-bitrise-io@2: {}
meta:
  bitrise.io:
    stack: linux-docker-android-22.04
    machine_type_id: standard
